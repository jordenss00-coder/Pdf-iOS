name: iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          set +e
          mkdir -p build
          xcodebuild build -project PDFAtolye.xcodeproj -scheme PDFAtolye -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO > build/device.log 2>&1
          status=$?
          grep -E 'error:|\*\* BUILD' build/device.log | head -80
          exit $status
      - name: Pick simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS-" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-"))
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      pro = "Pro" in device["name"] and "Max" not in device["name"]
                      found.append(((version, pro), device["udid"], device["name"]))
          found.sort()
          best = found[-1]
          print(best[1])
          print("Simulator:", best[2], file=sys.stderr)
          ')
          echo "SIM=$udid" >> "$GITHUB_ENV"
      - name: Run tests on simulator
        run: |
          set +e
          xcodebuild test -project PDFAtolye.xcodeproj -scheme PDFAtolye -destination "id=$SIM" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -resultBundlePath build/Tests.xcresult > build/test.log 2>&1
          status=$?
          grep -E '^DIAG|error:|Test Case .*(passed|failed)|XCTAssert|\*\* TEST' build/test.log | head -150
          exit $status
      - name: Screenshots
        if: always()
        timeout-minutes: 6
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/PDFAtolye.app
          [ -d "$app" ] || exit 0
          mkdir -p build/screens
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$SIM" "$app"
          shot() {
            name=$1; shift
            xcrun simctl terminate "$SIM" com.jordenss00.pdfatolye 2>/dev/null || true
            xcrun simctl launch "$SIM" com.jordenss00.pdfatolye "$@" >/dev/null
            sleep 5
            xcrun simctl io "$SIM" screenshot "build/screens/$name.png" >/dev/null
          }
          shot 01-home
          shot 02-watermark -demo watermark
          shot 03-merge -demo merge
          shot 04-split -demo split
          xcrun simctl ui "$SIM" appearance dark
          shot 05-home-dark
          shot 06-compress-dark -demo compress
          xcrun simctl shutdown "$SIM" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            build/*.log
            build/screens
          retention-days: 14
