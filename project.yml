name: PDFAtolye
options:
  bundleIdPrefix: com.jordenss00
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PDFAtolye:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - framework: Vendor/PDFium.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordenss00.pdfatolye
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PDF Atölye
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - PDFAtolyeSpikeTests
  PDFAtolyeSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Spike
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: PDFAtolye
      - framework: Vendor/PDFium.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordenss00.pdfatolye.spiketests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PDFAtolye.app/PDFAtolye
        BUNDLE_LOADER: $(TEST_HOST)
